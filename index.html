<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puggepuggepugge!</title>
  <link rel="stylesheet" href="EspanolStyle.css">
</head>
<body>

<a href="index.html" class="back-link">Til startsiden</a>

<div id="box">
  <div id="intro">
    <h1>Glosepuggeside</h1>
  </div>

  <div id="progress">
    <div id="progressBar"></div>
  </div>

  <p id="stats"></p>
  <p id="final"></p>

  <p id="modeTitle"><strong>Velg modus</strong></p>
  <div id="modeSelect">
    <button onclick="setMode('mc')">Flervalg</button>
    <button onclick="setMode('write')">Skriv ordet/uttrykket</button>
  </div>

  <div id="wordEntry">
    <label for="wordList"><strong>Legg inn ordlisten</strong></label>
    <p class="help-text">Én linje per par med ord/uttrykk. Ha komma mellom det utenlandske ordet/uttrykket og det norske.</p>
    <textarea id="wordList" rows="10" placeholder="hola, hei&#10;muchas gracias, tusen takk&#10;adiós, ha det&#10;dónde está la playa, hvor er stranda"></textarea>
    <p id="listError" class="list-error"></p>
    <button id="startQuizBtn" onclick="startGame()">Start QUIZ</button>
  </div>

  <p id="question"></p>

  <input id="answer" placeholder="Skriv inn svaret ditt">
  <div id="pointPopup">+1 poeng</div>
  <p></p>
  <button id="responderBtn" onclick="checkAnswer()">Svar</button>

  <div id="mcOptions">
    <button onclick="checkMC(0)" id="opt0"></button>
    <button onclick="checkMC(1)" id="opt1"></button>
    <button onclick="checkMC(2)" id="opt2"></button>
    <button onclick="checkMC(3)" id="opt3"></button>
  </div>

  <button id="nextBtn" onclick="nextQuestion()">Continue</button>
  <p id="feedback"></p>

<div id="restartOptions" style="display:none;">
  <button onclick="restartSameList('mc')">
    Start på nytt med samme liste (flervalg)
  </button>

  <button onclick="restartSameList('write')">
    Start på nytt med samme liste (skriv inn)
  </button>

  <button onclick="newList()">
    Lag en ny liste
  </button>
</div>

</div>

<script src="EspanolScript.js" defer></script>
</body>
</html>
